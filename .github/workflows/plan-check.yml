name: plan-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A plan pull request changes only the plan
        env:
          BASE: ${{github.base_ref}}
        run: |
          git diff --name-only "origin/$BASE...HEAD" > changed.txt
          cat changed.txt
          if grep -q '^docs/plans/' changed.txt; then
            echo "Not a plan pull request: nothing to check."
            exit 0
          else
            echo "Non-plan files changed."
            exit 1
          fi
          if grep -v '^docs/plans/' changed.txt; then
            echo "A plan pull request may change only docs/plans/."
            exit 1
          fi
      - name: Every plan has all five sections
        env:
          BASE: ${{github.base_ref}}
        run: |
          for f in $(git diff --name-only "origin/$BASE...HEAD" | grep '^docs/plans/'); do
           for s in "## Goal" "## Steps" "## Tests" "## Risks" "## Out of scope"; do
             if ! grep -q "$s" "$f"; then
               echo "Plan $f is missing section $s."
               exit 1
             fi
           done
          done
